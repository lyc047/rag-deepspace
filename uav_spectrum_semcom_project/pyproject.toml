[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-spectrum-semcom"
version = "0.1.0"
description = "Reproducible research code for task-oriented digital semantic reporting in collaborative wideband spectrum sensing."
readme = "README_CODE_START.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<2",
  "pillow>=10,<12",
  "scipy>=1.11,<2",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
]
vision = [
  "torchvision>=0.15",
  "ultralytics>=8.0",
]
research = [
  "pyldpc==0.7.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
